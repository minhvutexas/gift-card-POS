# /etc/nginx/sites-available/giftcard  (install.sh replaces DOMAIN)
# HTTPS is added afterwards by: sudo certbot --nginx -d DOMAIN
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    root /opt/giftcard/web/dist;
    index index.html;

    # Static assets are content-hashed: cache hard
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /health { proxy_pass http://127.0.0.1:4000; }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;          # live updates (server-sent events)
        proxy_read_timeout 1h;
        client_max_body_size 12m;
    }
}
